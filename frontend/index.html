<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宫炸弹人 · TauriCPP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo">弹</div>
                <h1>迷宫炸弹人</h1>
            </div>

            <div class="topbar-right">
                <span class="chip" id="scoreChip">得分 0</span>
                <button class="icon-btn" id="btnCollapse" title="折叠 / 展开功能面板">⟩</button>
            </div>
        </header>

        <main class="stage">
            <section class="board-wrap">
                <div class="board-glow"></div>
                <canvas id="board"></canvas>

                <!-- 胜利 -->
                <div class="win-overlay" id="winOverlay">
                    <div class="win-card">
                        <div class="win-badge">✦</div>
                        <h2>成功脱逃！</h2>
                        <p class="win-sub" id="winSub">你走出了迷宫</p>
                        <div class="win-stats">
                            <div><span id="winSteps">0</span><small>步数</small></div>
                            <div><span id="winTime">00:00</span><small>用时</small></div>
                            <div><span id="winScore">0</span><small>得分</small></div>
                        </div>
                        <p class="win-extra" id="winExtra">金币 0/0 · 宝箱 0/0 · 最短 0 步</p>
                        <button class="primary" id="btnWinAgain">再来一局</button>
                    </div>
                </div>

                <!-- 死亡 -->
                <div class="win-overlay" id="deadOverlay">
                    <div class="win-card is-dead">
                        <div class="win-badge">✖</div>
                        <h2 id="deadTitle">被炸弹炸死</h2>
                        <p class="win-sub" id="deadSub">小心引信，也要躲开怪物</p>
                        <div class="win-stats">
                            <div><span id="deadKills">0</span><small>击杀</small></div>
                            <div><span id="deadScore">0</span><small>得分</small></div>
                            <div><span id="deadTime">00:00</span><small>用时</small></div>
                        </div>
                        <button class="primary" id="btnRevive">复活重来 (R)</button>
                    </div>
                </div>
            </section>

            <aside class="panel" id="panel">
                <div class="group">
                    <div class="group-title">难度</div>
                    <div class="levels" id="levels">
                        <button class="level" data-level="0">简单</button>
                        <button class="level is-active" data-level="1">普通</button>
                        <button class="level" data-level="2">困难</button>
                        <button class="level" data-level="3">地狱</button>
                    </div>
                </div>

                <div class="group">
                    <div class="group-title">主题</div>
                    <div class="themes" id="themes"></div>
                </div>

                <div class="group">
                    <div class="group-title">音频</div>
                    <div class="levels">
                        <button class="level is-active" id="btnMusic">♪ 伴奏</button>
                        <button class="level is-active" id="btnSfx">♫ 音效</button>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="statSteps">0</span>
                        <span class="stat-label">步数</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statTime">00:00</span>
                        <span class="stat-label">用时</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statCoins">0/0</span>
                        <span class="stat-label">金币</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statChests">0/0</span>
                        <span class="stat-label">宝箱</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statKills">0</span>
                        <span class="stat-label">击杀</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statBlast">×1</span>
                        <span class="stat-label">炸弹威力</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="primary" id="btnNew">换个迷宫</button>
                    <button class="primary bomb" id="btnBomb" disabled>放炸弹 (空格)</button>
                    <button class="ghost" id="btnRestart">重玩本局</button>
                    <button class="ghost" id="btnHint">显示路径 (H)</button>
                </div>

                <div class="dpad">
                    <button class="pad pad-up" data-dx="0" data-dy="-1">▲</button>
                    <button class="pad pad-left" data-dx="-1" data-dy="0">◀</button>
                    <button class="pad pad-down" data-dx="0" data-dy="1">▼</button>
                    <button class="pad pad-right" data-dx="1" data-dy="0">▶</button>
                    <div class="pad-center"></div>
                </div>

                <div class="legend">
                    <div><i class="dot dot-player"></i>玩家</div>
                    <div><i class="dot dot-goal"></i>终点</div>
                    <div><i class="dot dot-coin"></i>金币 +10</div>
                    <div><i class="dot dot-chest"></i>宝箱范围+1</div>
                    <div><i class="dot dot-bomb"></i>炸弹</div>
                    <div><i class="dot dot-monster"></i>怪物</div>
                </div>

                <p class="tips">
                    WASD / 方向键移动 · 空格放炸弹 · R 换迷宫 · H 提示<br>
                    开局自带炸弹，吃宝箱可增加爆炸范围
                </p>
            </aside>
        </main>

        <footer class="statusbar">
            <span class="status-dot"></span>
            <span id="statusText">正在生成迷宫…</span>
            <span class="spacer"></span>
            <span class="badge">TauriCPP VirtualFS</span>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
